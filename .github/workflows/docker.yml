name: docker

on:
  # 发布 release 时构建正式镜像（等价 deploy/release.sh --push）
  release:
    types: [published]
  # test 分支每次 push/merge 构建测试镜像（等价 deploy/release.sh --test）
  push:
    branches: [test]
  # 手动兜底
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: fleyx/jcloud

jobs:
  # amd64 / arm64 分别在原生 runner 上并行构建，各推架构专属 tag
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # Dockerfile 直接 COPY deploy/jellyfin-ffmpeg7_<版本>-bookworm_<arch>.deb，
      # 而该 deb 被 .gitignore 排除不入库（本地由 deploy/release.sh 下载缓存），
      # CI 需在构建前自行下载；版本与下载源从 Dockerfile 的 ARG 解析（单一事实来源，与 release.sh 一致）
      - name: 解析 jellyfin-ffmpeg 版本与下载源
        id: ffmpeg
        run: |
          VERSION=$(grep -oP 'ARG JELLYFIN_FFMPEG_VERSION=\K.*' deploy/Dockerfile | head -n1)
          BASE_URL=$(grep -oP 'ARG JELLYFIN_FFMPEG_BASE_URL=\K.*' deploy/Dockerfile | head -n1)
          if [ -z "${VERSION}" ] || [ -z "${BASE_URL}" ]; then
            echo "错误：无法从 deploy/Dockerfile 解析 JELLYFIN_FFMPEG_VERSION / JELLYFIN_FFMPEG_BASE_URL"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_url=${BASE_URL}" >> "$GITHUB_OUTPUT"

      # 按 版本+架构 缓存 deb，命中则跳过下载
      - name: 缓存 jellyfin-ffmpeg deb
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: deploy/jellyfin-ffmpeg7_${{ steps.ffmpeg.outputs.version }}-bookworm_${{ matrix.suffix }}.deb
          key: jellyfin-ffmpeg-${{ steps.ffmpeg.outputs.version }}-${{ matrix.suffix }}

      - name: 下载 jellyfin-ffmpeg deb
        if: steps.deb-cache.outputs.cache-hit != 'true'
        run: |
          DEB="deploy/jellyfin-ffmpeg7_${{ steps.ffmpeg.outputs.version }}-bookworm_${{ matrix.suffix }}.deb"
          URL="${{ steps.ffmpeg.outputs.base_url }}/${{ matrix.suffix }}/jellyfin-ffmpeg7_${{ steps.ffmpeg.outputs.version }}-bookworm_${{ matrix.suffix }}.deb"
          echo "下载 jellyfin-ffmpeg deb: ${URL}"
          curl -fsSL -o "${DEB}.tmp" "${URL}"
          mv "${DEB}.tmp" "${DEB}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # release 触发：版本号取 tag（去前导 v）；其余触发：test 标签
      - name: 计算镜像版本标签
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送 ${{ matrix.suffix }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: CN_MIRROR=false
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ steps.meta.outputs.tag }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  # 合并两个架构的镜像为 multi-arch manifest，并打最终标签
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 合并 manifest 并推送最终标签
        run: |
          REPO="${{ env.DOCKERHUB_REPO }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            docker buildx imagetools create \
              -t "${REPO}:${VERSION}" \
              -t "${REPO}:latest" \
              "${REPO}:${VERSION}-amd64" "${REPO}:${VERSION}-arm64"
            echo "发布完成：${REPO}:${VERSION}、${REPO}:latest"
          else
            docker buildx imagetools create \
              -t "${REPO}:test" \
              "${REPO}:test-amd64" "${REPO}:test-arm64"
            echo "测试镜像推送完成：${REPO}:test"
          fi
