services:
  jcloud:
    image: ${JCLOUD_IMAGE:-fleyx/jcloud:latest}
    container_name: jcloud
    # 指定运行用户：PUID/PGID 设为宿主机用户的 uid/gid，使数据目录落盘文件归属该用户；
    # 默认 0:0（root）保持向后兼容。从 root 切换到非 root 前，需先在宿主机
    # chown -R PUID:PGID 数据目录（详见 deploy.md「指定运行用户」）
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${JCLOUD_PORT:-80}:${JCLOUD_PORT:-80}"
    environment:
      # 容器内无 PUID 对应的 passwd 条目，caddy/LibreOffice 需要可写 HOME
      - HOME=/tmp
      # 时区：透传宿主机 TZ 环境变量，未设置时默认 Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}
      - JCLOUD_PORT=${JCLOUD_PORT:-80}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/jcloud}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-postgres}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - JCLOUD_JWT_SECRET=${JCLOUD_JWT_SECRET:-change-me-in-production-jcloud-secret-key-2026}
      - spring.profiles.active=prod
      # 关闭 MyBatis SQL 日志（application.yml 默认 StdOutImpl）
      - mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
      # 视频转码硬件加速（NVIDIA NVENC/NVDEC）：需宿主机已安装 nvidia-container-toolkit，
      # 与下方 deploy 块一起取消注释启用（TrueNAS SCALE 24.10+ 先在 Apps → Configure → Settings 勾选 Install NVIDIA Drivers）
      # - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - ${JCLOUD_DATA_PATH:-./data}/jcloud:/data/jcloud
    # 视频转码硬件加速（VAAPI/QSV）：映射 GPU 渲染节点；无核显/独显时可删除
    devices:
      - /dev/dri:/dev/dri
    # 非 root（PUID/PGID）运行时 GPU 硬解需要宿主机 video/render 组权限，gid 因宿主机而异；
    # 用 stat -c '%g' /dev/dri/renderD128（及 /dev/dri/card0）查询后，取消注释并替换：
    # group_add:
    #   - "983"
    #   - "987"
    # 视频转码硬件加速（NVIDIA NVENC/NVDEC）：与上方 NVIDIA_DRIVER_CAPABILITIES 一起取消注释启用
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: jcloud-postgres
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      POSTGRES_DB: jcloud
    volumes:
      - ${JCLOUD_DATA_PATH:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - db

  redis:
    image: redis:7-alpine
    container_name: jcloud-redis
    volumes:
      - ${JCLOUD_DATA_PATH:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - cache
