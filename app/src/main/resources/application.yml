server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 1000

jcloud:
  jwt:
    secret: ${JCLOUD_JWT_SECRET:change-me-in-production-jcloud-secret-key-2026}
    expire-hours: 24
    issuer: jcloud
  cors:
    allowed-origins:
      - http://localhost:5173

spring:
  application:
    name: jcloud
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  datasource:
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.fleyx.jcloud.model.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

logging:
  level:
    com.fleyx.jcloud: info
    org.flywaydb: info
