server:
  port: 8080
  servlet:
    context-path: /

  tomcat:
    threads:
      max: 1000

jcloud:
  jwt:
    secret: ${JCLOUD_JWT_SECRET:change-me-in-production-jcloud-secret-key-2026}
    expire-hours: 2
    issuer: jcloud
  auth:
    refresh-expire-days: 30
    rotation-grace-seconds: 30
  upload:
    chunk-size: 67108864
  download:
    zip-stream-threshold-size: 104857600
    zip-stream-threshold-count: 100
    zip-task-ttl-minutes: 60
  remote:
    encryption-key: ${JCLOUD_REMOTE_ENC_KEY:change-me-remote-enc-key}
  preview:
    libreoffice-path: ${JCLOUD_LIBREOFFICE_PATH:soffice}
    office-max-convert-size: 52428800
    convert-timeout-seconds: 60
    max-concurrent-conversions: 2

spring:
  application:
    name: jcloud
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  datasource:
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 10s
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 256MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.fleyx.jcloud.model.po
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id

logging:
  pattern:
    # 日志行头固定包含 traceId 和代码行号，便于链路排查
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %-40.40logger{39}:%L [%15.15thread] : %msg%n"
  level:
    com.fleyx.jcloud: info
    # MyBatis SQL 日志由 Slf4jImpl 以 debug 级别输出，mapper 包需单独开启
    com.fleyx.jcloud.mapper: debug
    org.flywaydb: info
