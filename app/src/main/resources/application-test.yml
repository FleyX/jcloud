spring:
  datasource:
    # 测试库用本地 PG（dev.lan 远程库 RTT ~6ms 会均匀放大每条 SQL 的耗时，拖慢整个套件）
    url: jdbc:postgresql://localhost:5432/jcloud_test
    username: postgres
    password: postgres
    hikari:
      # 测试 JVM 内多个 Spring 上下文各持一个连接池，限制单池大小避免打满 max_connections
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      database: 1

jcloud:
  media:
    # 测试环境关闭启动硬解探测，避免触发真实 ffmpeg 编码（无 GPU 的 CI 可跑）
    hwaccel-probe-enabled: false
  preview:
    # 测试环境缩小转换上限，便于验证大小闸门
    office-max-convert-size: 2048
